name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.0
      - name: Terraform fmt check (examples)
        run: terraform fmt -check -recursive examples
      - name: Terraform validate (aws-basic)
        working-directory: examples/aws-basic
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform validate (three-tier-webapp)
        working-directory: examples/three-tier-webapp
        run: |
          terraform init -backend=false
          terraform validate
