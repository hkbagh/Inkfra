name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.0
      - name: Terraform fmt check (examples)
        run: terraform fmt -check -recursive examples
      - name: Terraform validate (aws-basic)
        working-directory: examples/aws-basic
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform validate (three-tier-webapp)
        working-directory: examples/three-tier-webapp
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform validate (eks-production-platform)
        working-directory: examples/eks-production-platform
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform validate (eks-production-platform bootstrap)
        working-directory: examples/eks-production-platform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform validate (aws-serverless-edge)
        working-directory: examples/aws-serverless-edge
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform validate (aws-serverless-edge bootstrap)
        working-directory: examples/aws-serverless-edge/bootstrap
        run: |
          terraform init -backend=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: Run TFLint
        run: |
          tflint --init
          tflint --chdir=examples/aws-basic
          tflint --chdir=examples/three-tier-webapp
          tflint --chdir=examples/eks-production-platform
          tflint --chdir=examples/aws-serverless-edge
